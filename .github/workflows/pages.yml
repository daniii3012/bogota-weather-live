# Publicación en GitHub Pages.
#
# Requiere en el repositorio (Settings):
#   Pages → Source: «GitHub Actions»
#   Secrets and variables → Actions → Variables:
#     API_BASE   dirección del intermediario (https://bogota-weather-live.<subdominio>.workers.dev)
# Se lanza con cada cambio en `main` o a mano.
name: Publicar en Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Comprobar configuración
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          test -n "$API_BASE" || { echo "::error::Falta la variable API_BASE (dirección del intermediario)"; exit 1; }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Compilar
        env:
          VITE_API_BASE: ${{ vars.API_BASE }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
